let mode='default',streetIndex=0,chosen=2,pro=false,runId=0,timers=[],phase='playing',currentEvent=-1,showdown=false;const clean=()=>mode==='clean',unsupported=()=>mode==='unsupported';const grade=d=>(d===2&&!clean()?'fix':'good');const sym=d=>unsupported()?'–':grade(d)==='fix'?'!':'✓';const color=d=>unsupported()?'na':grade(d);const wait=(t)=>new Promise(resolve=>{let h=setTimeout(resolve,t);timers.push({id:h,resolve})});function cancel(){runId++;for(const t of timers){clearTimeout(t.id);t.resolve()}timers=[];}
function c(s){let suit=s.slice(-1),rank=s.slice(0,-1),red='♥♦'.includes(suit);return `<div class="pokerCard ${red?'red':''}">${rank}${suit}</div>`}function backs(){return '<div class="pokerCard back">♧</div><div class="pokerCard back">♧</div>'}
function scoreAnimate(){const el=$('scoreNum');if(!el)return;let start=performance.now();function tick(now){if(!$('scoreNum')||mode==='loading'||mode==='unsupported')return;let p=Math.min(1,(now-start)/600);el.textContent=Math.round((clean()?100:78)*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(tick)}requestAnimationFrame(tick)}
function summary(){if(mode==='loading'){$('summary').innerHTML='<div class="loadingSkeleton">Reviewing your hand…</div>';return}if(unsupported()){$('summary').innerHTML='<div class="unavailable">— This hand can’t be reviewed yet<div class="mutedNote" style="margin-top:8px">For example, hands with straddles or 4+ players.</div></div>';return}let s=clean()?100:78;$('summary').innerHTML=`<div class="kicker">Your hand at a glance</div><div class="scoreline"><div class="score"><span id="scoreNum">${s}</span><small>/100</small></div><span class="medal">✦</span></div><div class="gradeCopy">${clean()?'Perfect hand!':'Almost perfect!'}</div><div class="stats"><div class="stat"><strong>${clean()?'5 / 5':'4 / 5'}</strong><span>Good decisions</span></div><div class="stat"><strong>${clean()?'0':'1'}</strong><span>To review</span></div><div class="stat"><strong>${clean()?'0 chips':'&lt; 1 chip'}</strong><span>Given up by mistakes</span></div></div><div class="infocard"><div class="sectionName">Hand info</div><div class="playerheads"><div class="playerbox"><div class="identity"><i>BTN</i> · You</div><div class="pocket">${c('K♠')}${c('Q♥')}</div></div><div class="playerbox"><div class="identity">BB · pp2744021</div><div class="pocket">${c('A♠')}${c('J♣')}</div></div></div><div class="boardLabel">BOARD</div><div class="board">${board.map(c).join('')}</div><div class="divider"></div><div class="resultline"><span>Final result</span><strong>−114</strong></div><div class="luck">Lost to a better hand — not to your play.</div></div>`}
function tabs(){ $('tabs').innerHTML=streets.map((s,i)=>`<button class="streetTab ${i===streetIndex?'active':''}" data-street="${i}" aria-pressed="${i===streetIndex}"><span class="gradeicon ${unsupported()?'na':i===0&&!clean()?'fix':'good'}">${unsupported()?'–':i===0&&!clean()?'!':'✓'}</span>${s.name}</button>`).join('');document.querySelectorAll('[data-street]').forEach(el=>el.onclick=()=>goStreet(+el.dataset.street));$('streetTitle').textContent=streets[streetIndex].name;}
function setBoard(n,animate=false){let shown=board.slice(0,n);$('feltBoard').innerHTML=shown.map((x,i)=>`<div class="${animate&&i===n-1?'dealing':''}">${c(x)}</div>`).join('')}
function resetTable(i){const s=streets[i];showdown=false;currentEvent=-1;chosen=s.decisions[s.decisions.length-1];$('pot').textContent='Pot · '+s.startPot;$('heroStack').textContent='BTN · '+s.heroStart;$('bbStack').textContent='BB · '+s.bbStart;$('heroCards').innerHTML=c('K♠')+c('Q♥');$('bbCards').innerHTML=backs();$('heroSeat').classList.remove('active','winner');$('bbSeat').classList.remove('active','winner');$('actionBubble').className='actionBubble';$('chips').classList.remove('live');$('ghostWrap').innerHTML='';$('flashWrap').innerHTML='';document.querySelectorAll('.foldseat').forEach(el=>el.classList.toggle('faded',i>0));setBoard(s.board);$('phaseNote').textContent='Playing '+s.name+'…'}
function bubble(actor,text){let el=$('actionBubble');el.className='actionBubble '+(actor==='hero'?'heroBubble':'');el.textContent=text;void el.offsetWidth;el.classList.add('show');$('heroSeat').classList.toggle('active',actor==='hero');$('bbSeat').classList.toggle('active',actor==='bb'||actor==='BB');if(actor==='hero'||actor==='bb'||actor==='BB'){ $('chips').classList.remove('live');void $('chips').offsetWidth;$('chips').classList.add('live')}}
function endBubble(){ $('actionBubble').classList.remove('show');$('heroSeat').classList.remove('active');$('bbSeat').classList.remove('active');$('chips').classList.remove('live')}
function renderGhost(){ $('ghostWrap').innerHTML=!unsupported()&&!clean()&&chosen===2?'<div class="ghost">Better · Raise 60<small>Suggested action, not played</small></div>':''}
function showMoment(d){chosen=d;phase='decision';$('phaseNote').textContent=`Decision ${d} · ${streets[streetIndex].name}`;renderGhost();renderAnalysis();}
function word(p){return p>=90?'Almost always':p>=60?'Usually':p>=25?'Often':'Sometimes'}
function renderAnalysis(){let s=streets[streetIndex];if(unsupported()){$('analysis').innerHTML=`<div class="greyMessage">— ${s.name} replay only. No coaching available for this hand.</div>`;return}let dec=decisions[chosen];let selector=s.decisions.length>1?`<div class="decisionSelector">${s.decisions.map(d=>`<button class="decisionChip ${chosen===d?'selected':''}" data-decision="${d}">${d} · ${d===1?'Raise 6':'Call 24'} ${sym(d)}</button>`).join('')}</div>`:'';let opts=dec.opts.map((o,j)=>{let tags=o.slice(2).filter(Boolean);let rowTag=tags.map(t=>`<span class="tag ${t==='You'?'you':''}">${t}</span>`).join('');return `<div class="optionRow ${tags.includes('You')?'youBar':''}"><div class="optionTop"><span class="optionName">${o[0]}</span><span class="tags">${rowTag}</span><span class="word">${pro?o[1]+'%':word(o[1])}</span></div><div class="track"><div class="fill" data-width="${o[1]}"></div></div></div>`}).join('');$('analysis').innerHTML=`${selector}<div class="analTitle"><span class="gradeicon ${color(chosen)}">${sym(chosen)}</span>${clean()&&chosen===2?'Good call!':dec.title}</div><p class="analText">${clean()&&chosen===2?'Calling is a solid choice in this hand.':dec.text}</p>${opts}<div class="proToggle"><span>Pro view · exact numbers</span><button class="switch ${pro?'on':''}" id="proButton" aria-label="Toggle Pro view" aria-pressed="${pro}"></button></div>${pro?`<div class="proArea"><div class="proline">${dec.pro||'Exact option choices are shown above. All values are in chips.'}</div></div>`:''}`;document.querySelectorAll('[data-decision]').forEach(el=>el.onclick=()=>selectDecision(+el.dataset.decision));$('proButton').onclick=()=>{pro=!pro;renderAnalysis()};requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.fill').forEach(el=>el.style.width=el.dataset.width+'%')))}
function snapshotToDecision(d){let s=streets[streetIndex];resetTable(streetIndex);let idx=s.events.findIndex(e=>e[2]===d);for(let k=0;k<=idx;k++){const e=s.events[k];if(e[3]!==null&&e[3]!==undefined)$('heroStack').textContent='BTN · '+e[3];if(e[4]!==null&&e[4]!==undefined)$('bbStack').textContent='BB · '+e[4]}$('pot').textContent='Pot · '+s.startPot;chosen=d;showMoment(d);$('phaseNote').textContent='Decision '+d+' · tap Replay street to watch';}
function selectDecision(d){cancel();phase='decision';snapshotToDecision(d)}
async function playback(i){cancel();let mine=runId;streetIndex=i;tabs();resetTable(i);phase='playing';renderAnalysis();const s=streets[i];if(i>0){setBoard(i===1?0:i===2?3:4);await wait(130);if(mine!==runId)return;setBoard(s.board,true);await wait(320);if(mine!==runId)return}for(let k=0;k<s.events.length;k++){if(mine!==runId)return;let e=s.events[k];currentEvent=k;if(e[0]==='other'||e[0]==='SB'){if(e[1].includes('fold')||e[1]==='Fold'){document.querySelectorAll('.foldseat').forEach(el=>el.classList.add('faded'))}}bubble(e[0],e[1]);if(e[3]!==null&&e[3]!==undefined)$('heroStack').textContent='BTN · '+e[3];if(e[4]!==null&&e[4]!==undefined)$('bbStack').textContent='BB · '+e[4];await wait(e[0]==='other'?280:500);if(mine!==runId)return;endBubble();await wait(90);if(mine!==runId)return}
$('pot').textContent='Pot · '+s.endPot;$('phaseNote').textContent='Street complete · '+s.name;const last=s.decisions[s.decisions.length-1];showMoment(last);if(i===3){await wait(380);if(mine!==runId)return;$('bbCards').innerHTML=c('A♠')+c('J♣');$('bbSeat').classList.add('winner');$('flashWrap').innerHTML='<div class="resultFlash">BB wins · 229 chips</div>';$('phaseNote').textContent='Showdown · BB wins 229';}}
function goStreet(i){if(i===streetIndex&&phase==='playing')return;playback(i)}
function openModal(){let m=$('stateModal');m.hidden=false;m.className='stateShade';m.innerHTML=`<div class="stateMenu"><h3>Preview states</h3><button data-mode="default">1 · Default hand</button><button data-mode="clean">2 · Clean hand</button><button data-mode="loading">3 · Loading</button><button data-mode="unsupported">4 · Can’t analyse</button><button data-dismiss>Close</button></div>`;m.querySelectorAll('[data-mode]').forEach(el=>el.onclick=()=>setMode(el.dataset.mode));m.querySelector('[data-dismiss]').onclick=()=>{m.hidden=true};}
async function setMode(next){cancel();mode=next;let m=$('stateModal');m.hidden=true;summary();streetIndex=0;tabs();resetTable(0);pro=false;if(next==='loading'){$('analysis').innerHTML='<div class="greyMessage">Coach is reviewing your hand…</div>';await wait(1500);if(mode!=='loading')return;mode='default';summary();scoreAnimate()}else if(next!=='unsupported')scoreAnimate();playback(0)}
$('statesBtn').onclick=openModal;$('replayStreet').onclick=()=>playback(streetIndex);summary();scoreAnimate();playback(0);
</script></body></html>
