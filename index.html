/* GTO-inspired two-player composition: strong seats, hole cards attached to their owners. */
.tableArea{overflow:hidden}
.tableArea .seat{width:110px;min-width:110px;height:62px;gap:2px;z-index:7;pointer-events:none}
.tableArea .seat.bb{top:7px}

.tableArea .hero .seattext{background:#332a1bf2;color:#ffe7a3;border-color:#9b7b43}
/* Card faces sit only 5px from the avatar rim, not as distant extra seats. */
.tableArea .seatcards{position:absolute;left:calc(50% + 26px);top:5px;display:flex;gap:2px;white-space:nowrap;pointer-events:none;z-index:1}
.tableArea .seatcards .card{width:21px;height:30px;font-size:12px;border-radius:4px;border-bottom-width:3px;box-shadow:0 1px 3px #041b20a8;flex:none}
.tableArea .bet.bb{top:82px;z-index:3}
.tableArea .bet.hero{bottom:68px;z-index:3}
.tableArea .seatbubble.bb{top:74px;right:8px;max-width:112px}
.tableArea .seatbubble.hero{bottom:74px;right:8px;max-width:112px}
.tableArea .pot{top:106px;z-index:2}
.tableArea .feltBoard{top:143px;z-index:2}
.tableArea .ghost{bottom:82px;left:6px;max-width:119px;font-size:10px;z-index:5}
.tableArea .dealer{right:calc(50% - 57px);bottom:31px;z-index:8;width:16px;height:16px;font-size:9px}
.tableArea .foldDot{opacity:.7;width:12px;height:12px;border-color:#a8c9c3;background:#587a80}
.tableArea .foldDots.fade{opacity:.12}
.tableArea [hidden]{display:none!important}
@media(max-width:370px){.tableArea .seatcards .card{width:19px;height:28px}.tableArea .ghost{max-width:104px}}

'use strict';const $=id=>document.getElementById(id),BOARD=['A♥','7♥','4♠','Q♣','2♠'];const event=(actor,text,amt=0,d=null)=>({actor,text,amt,decision:d});const STREETS=[{name:'Preflop',pot:0,board:0,events:[event('sb','Post 1',1),event('bb','Post 2',2),event('other','UTG · HJ · CO fold'),event('hero','Raise to 6',6,1),event('sb','Fold'),event('bb','Raise to 24',22),event('hero','Call to 24',18,2)],decisions:[1,2]},{name:'Flop',pot:49,board:3,events:[event('bb','Check'),event('hero','Check',0,3)],decisions:[3]},{name:'Turn',pot:49,board:4,events:[event('bb','Bet 30',30),event('hero','Call 30',30,4)],decisions:[4]},{name:'River',pot:109,board:5,events:[event('bb','Bet 60',60),event('hero','Call 60',60,5)],decisions:[5]}];const DEC={1:{title:'Nice open!',line:'K-Q on the button is a clear raise.',options:[['Raise 6',85,'Best · You'],['Call',10,''],['Fold',5,'']]},2:{title:'Better: Raise to 60',line:'BB re-raised. You called — re-raising to 60 wins more.',options:[['Raise 60',42,'Best'],['Call',32,'You'],['Fold',26,'']],extra:'Calling gives up about 0.4 chips on average versus raising.'},3:{title:'Smart check!',line:"Checking keeps the pot small when the ace doesn't help you.",options:[['Check',80,'Best · You'],['Bet 16',20,'']]},4:{title:'Good call!',line:'Your pair of queens is worth a call here.',options:[['Call',70,'Best · You'],['Fold',25,''],['Raise 90',5,'']]},5:{title:'Good call!',line:'Folding here gives up too often to bluffs.',options:[['Call',65,'Best · You'],['Fold',35,'']]}};let mode='default',street=0,chosen=2,started=false,token=0,played=false,loadToken=0;const clean=()=>mode==='clean',unsupported=()=>mode==='unsupported',score=()=>clean()?100:78;function card(s){let suit=s.slice(-1);return `<span class="card ${'♥♦'.includes(suit)?'red':''}">${s}</span>`}function backs(){return '<span class="card back">♠</span><span class="card back">♠</span>'}function grade(d){return d===2&&!clean()?'fix':'good'}function delay(ms){return new Promise(r=>setTimeout(r,ms) function clearBubble(){$('bubble').hidden=true;$('heroSeat').classList.remove('active');$('bbSeat').classList.remove('active')}
function draw(i,count,{suggest=false,showdown=false,collected=false,action=null,initial=false}={}){let s=STREETS[i],v=snapshot(i,count);$('streetName').textContent=s.name;$('heroStack').textContent='You · '+v.hero;$('bbStack').textContent='BB · '+v.bb;$('pot').textContent='Pot · '+(showdown?229:collected?(i===0?49:i===1?49:i===2?109:229):v.pot);$('heroBet').hidden=!v.heroBet||showdown||collected;$('heroBet').textContent=v.heroBet;$('bbBet').hidden=!v.bbBet||showdown||collected;$('bbBet').textContent=v.bbBet;$('bbCards').innerHTML=showdown?card('A♠')+card('J♣'):backs();$('heroCards').innerHTML=card('K♠')+card('Q♥');$('bbSeat').classList.toggle('winner',showdown);$('showdownFlag').hidden=!showdown;$('ghost').hidden=!suggest||unsupported()||clean();$('foldDots').classList.toggle('fade',i!==0||count>4);board(s.board,!initial);if(action)bubble(action.actor,action.text);else clearBubble();if(showdown){$('heroBet').hidden=true;$('bbBet').hidden=true}}
function showAnalysis(){let s=STREETS[street];if(unsupported()){$('analysis').innerHTML='<div class="muted">— Replay only. This hand has no coaching analysis.</div>';return}let d=DEC[chosen];let select=s.decisions.length>1?`<div class="decisionSelector">${s.decisions.map(n=>`<button class="${chosen===n?'selected':''}" data-decision="${n}">${n} · ${n===1?'Raise 6':'Call 24'} <span class="grade ${grade(n)==='fix'?'fix':''}">${grade(n)==='fix'?'!':'✓'}</span></button>`).join('')}</div>`:'';let good=grade(chosen)==='good';let title=chosen===2&&clean()?'Good call!':d.title;let sentence=chosen===2&&clean()?'Calling is a solid choice in this clean-hand example.':d.line;$('analysis').innerHTML=`${select}<div class="atitle ${good?'good':'fix'}"><span>${good?'✓':'!'}</span>${title}</div><div class="explain">${sentence}</div>${d.options.filter(o=>o[1]>=5).map(o=>`<div class="option"><div class="optionName">${o[0]}${o[2]?`<span class="tag ${o[2]==='You'?'you':''}">${o[2]}</span>`:''}</div><div class="bar"><div class="fill" data-width="${o[1]}"></div></div><span class="optionPct">${o[1]}%</span></div>`).join('')}${chosen===2&&!clean()?`<div class="footline">${d.extra}</div>`:''}`;document.querySelectorAll('[data-decision]').forEach(x=>x.onclick=()=>selectDecision(+x.dataset.decision));requestAnimationFrame(()=>document.querySelectorAll('.fill').forEach(x=>x.style.width=x.dataset.width+'%'))}
function selectDecision(d){token++;chosen=d;let events=STREETS[street].events,idx=events.findIndex(e=>e.decision===d);draw(street,idx+1,{suggest:d===2});showAnalysis()}
async function enterStreet(i,play=true){token++;let my=token;street=i;chosen=STREETS[i].decisions.at(-1);tabs();showAnalysis();draw(i,0,{initial:true});if(!play)return;let events=STREETS[i].events;for(let k=0;k<events.length;k++){if(my!==token)return;let ev=events[k];draw(i,k+1,{action:ev,suggest:false});await delay(ev.actor==='other'?180:ev.actor==='sb'?300:470);if(my!==token)return;clearBubble();await delay(70)}if(my!==token)return;draw(i,events.length,{suggest:i===0,collected:true});if(i===3){await delay(350);if(my!==token)return;draw(i,events.length,{showdown:true});}showAnalysis()}
function observe(){let el=$('tableArea');if('IntersectionObserver' in window){let io=new IntersectionObserver(entries=>{if(entries[0]?.intersectionRatio>=.32&&!played&&mode!=='loading'){played=true;enterStreet(0,true);io.disconnect()}},{root:$('scroller'),threshold:[0,.32,.6]});io.observe(el)}else{played=true;enterStreet(0,true)}}
async function changeMode(m){loadToken++;let seq=loadToken;token++;mode=m;started=true;summary();if(m==='loading'){played=false;$('analysis').innerHTML='<div class="muted">Reviewing your hand…</div>';await delay(1500);if(seq!==loadToken)return;mode='default';summary()}street=0;chosen=2;tabs();showAnalysis();draw(0,0,{initial:true});if(played)enterStreet(0,true);else observe()}
$('statesBtn').onclick=()=>{$('modal').hidden=false;$('modal').innerHTML=`<div class="statesMenu"><strong>Preview states</strong><button data-mode="default">Default</button><button data-mode="clean">Clean hand</button><button data-mode="loading">Loading</button><button data-mode="unsupported">Can't analyse</button><button id="dismiss">Close</button></div>`;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{$('modal').hidden=true;changeMode(b.dataset.mode)});$('dismiss').onclick=()=>$('modal').hidden=true};$('replayStreet').onclick=()=>enterStreet(street,true);started=true;summary();tabs();showAnalysis();draw(0,0,{initial:true});observe();
</script></body></html>
