<script>
const $=id=>document.getElementById(id);let expanded=null,whyOpen=false,tipShown=false,stress=false,wrapup=false,handIndex=2;const streets=[{name:'Preflop',cards:['K♠','Q♥'],pot:'',actions:[['hero','BTN','Posts SB','1','199','blind',null],['villain','BB','Posts BB','2','198','blind',null],['hero','BTN','Raise to','6','194','raise','good'],['villain','BB','Raise to','24','176','raise',null],['hero','BTN','Call','24','176','call','fix']]},{name:'Flop',cards:['A♥','7♥','4♠'],pot:'48',actions:[['villain','BB','Check','—','176','check',null],['hero','BTN','Check','—','176','check','good']]},{name:'Turn',cards:['A♥','7♥','4♠','Q♣'],pot:'48',actions:[['villain','BB','Bet','30','146','raise',null],['hero','BTN','Call','30','146','call','good']]},{name:'River',cards:['A♥','7♥','4♠','Q♣','2♠'],pot:'108',actions:[['villain','BB','Bet','60','86','raise',null],['hero','BTN','Call','60','86','call','good']]}];
const longName='ОченьДлинныйНикИгрока'; const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');function card(str){const s=str.slice(-1),r=str.slice(0,-1);return `<span class="card ${'♥♦'.includes(s)?'red':''}"><span>${r}</span><span class="suit">${s}</span></span>`}function cards(a){return `<div class="cards">${a.map(card).join('')}</div>`}function ico(grade){return `<span class="status ${grade}" aria-label="${grade}">${{good:'✓',close:'◌',slip:'!',fix:'!',unknown:'–'}[grade]||'–'}</span>`}function currentState(){return handIndex+1}function reviewed(){return ![1,2,8,9].includes(currentState())}function grades(){let s=currentState();return s===4||s===5?['good','good','good','good','good']:s===7?['good','unknown','good','good','fix']:s===11?['good','fix','good','slip','fix']:['good','fix','good','good','good']}
function analysisFor(id){if(!reviewed())return null;const [a,b,c,d,e]=grades();return ({'Preflop-2':a,'Preflop-4':b,'Flop-1':c,'Turn-1':d,'River-1':e})[id]||null}function isMistake(g){return g==='fix'||g==='slip'}function mistakes(){return Object.entries({'Preflop-2':'Raise to 6','Preflop-4':'Call 24','Flop-1':'Check','Turn-1':'Call 30','River-1':'Call 60'}).filter(([id])=>isMistake(analysisFor(id))).map(([id])=>id)}function ghostAdvice(id){return id==='Preflop-4'?{title:'Raise to',amt:'60',sentence:'BB re-raised to 24. You called — re-raising to 60 wins more.',why:'KQ is strong enough to re-raise, and it puts pressure on BB’s bluffs.',opts:[['Raise 60','Best'],['Call','You'],['Fold','Also fine']]}:id==='Turn-1'?{title:'Fold',amt:'',sentence:'BB bet 30. Calling is less useful here — folding saves more chips.',why:'This is illustrative guidance for testing a second mistake.',opts:[['Fold','Best'],['Call','You']]}:{title:'Check',amt:'',sentence:'You took this action — checking would be a little better here.',why:'The difference in average chips is small in this mock.',opts:[['Check','Best'],['Bet','You']]}}function ghost(id){const d=ghostAdvice(id),on=expanded===id;let index=mistakes().indexOf(id);return `<div class="ghost" id="ghost-${id}"><div class="ghosthead" data-toggle="${id}"><span class="mini">✦</span><span class="better">Better: ${d.title}</span><span class="actionicon ${d.title==='Check'?'check':'raise'}">${d.title==='Check'?'C':d.title==='Fold'?'F':'R'}</span><span class="val">${d.amt}</span><span class="arrow">${on?'⌃':'⌄'}</span></div>${on?`<div class="ghostdetail"><p class="sentence">${esc(d.sentence)}</p><div class="options">${d.opts.map(([name,tag])=>`<span class="option ${tag==='You'?'you':tag==='Also fine'?'fine':''}">${name}<strong>${tag}</strong></span>`).join('')}</div><div class="links"><button class="link" data-why="${id}">${whyOpen?'Hide details':'Why?'}</button>${index< mistakes().length-1?`<button class="link" data-nextmistake="${mistakes()[i function getVerdict(){const s=currentState();if(s===1)return 'Review this hand with Coach';if(s===2)return 'Coach is reviewing…';if(s===8)return 'Coach can’t review this game type yet';if(s===9)return 'Coach is busy — try again';if(s===4)return 'Clean hand — every decision was solid';if(s===5)return 'Played well — lost to a better hand';if(s===6)return 'You won, but 1 decision to fix';if(s===7)return '3 good · 1 to fix · 1 not analysed';if(s===11)return '2 good · 3 to fix · Lost to a better hand';return '4 good · 1 to fix · Lost to a better hand'}
function verdict(){let s=currentState(),fixed=[1,2,8,9,4,5,6].includes(s),copy=getVerdict();return `<div class="verdict ${fixed?'single':''}" id="verdict"><span class="avatar">✦</span>${s===2?'<span class="spinner"></span>':''}${fixed?`<span class="vmain">${copy}</span>`:`<span class="vmain">${copy.split(' · Lost')[0]}</span><span class="vsub">${copy.includes('Lost')?'Lost to a better hand':''}</span>`}${s===9?'<button class="retry" id="retry">Retry</button>':'<span class="arrow">›</span>'}</div>`}
function row(street,act,j){let [who,position,label,amt,stack,type]=act,id=`${street}-${j}`,hero=who==='hero',grade=hero?analysisFor(id):null,miss=isMistake(grade),alternative=false;const nm=hero?'WWWWW…':'pp2744021…';return `<div class="act ${hero?'hero':''} ${miss&&!alternative?'flag':''}" id="row-${id}" ${alternative&&hero&&grade?`data-inline="${id}" style="cursor:pointer"`:''}><span class="position ${hero?'hero':''}">${position}</span><span class="name">${stress?(hero?'ОченьДлинныйНикГероя':longName):nm}</span><span class="actionicon ${type}">${{raise:'B',call:'C',check:'C',blind:position==='BTN'?'SB':'BB'}[type]}</span><span class="amount">${amt}</span><span class="stack">${alternative&&grade?ico(grade):miss?ico(grade):''}${stack}</span></div>${alternative&&expanded===id?`<div class="inline-expand">${grade==='good'?'Good decision. Keep it up.':ghostAdvice(id).sentence}${isMistake(grade)?`<div style="margin-top:7px"><button class="link" data-why="${id}">Why?</button>${whyOpen?`<div class="why">${ghostAdvice(id).why}</div>`:''}</div>`:''}</div>`:''}${!alternative&&miss?ghost(id):''}${grade==='close'?`<div class="inline-note">Close spot — this barely matters.</div>`:''}`}
function streetHTML(o){let actions=o.actions;if(stress){actions=[...Array.from({length:7},(_,i)=>['villain',i%2?'UTG':'CO','Check','—','198','check',null]),...o.actions]}const gs=o.actions.map((a,j)=>analysisFor(`${o.name}-${j}`)).filter(Boolean);const g=gs.includes('fix')?'fix':gs.includes('slip')?'slip':gs.includes('unknown')?'unknown':gs.length?'good':null;return `<section><div class="street"><span class="streetname">${o.name}</span>${cards(o.cards)}${g?ico(g):''}<span class="pot">${o.pot}</span></div>${actions.map((a,j)=>row(o.name,a,stress&&j<7?['extra',j].join('-'):j-(stress?7:0))).join('')}</section>`}
